# MCP Gateway + MCP Shield (through-gateway mode)
#
# Replace PLACEHOLDER with your cluster apps domain (e.g. cluster.example.com so hostnames become *.apps.cluster.example.com).
#
# Traffic: clients -> OpenShift Route (port 8081, MCP Shield) -> OAuth + proxy token exchange -> localhost:8080 (broker).
# MCP_SHIELD_DIRECT_TOOL_ROUTING=false: all JSON-RPC (including tools/call) goes through mcp-gateway; Shield still forwards
# the real OpenShift access token in Authorization after proxy-token exchange.
#
# Kuadrant AuthPolicy: do NOT put JWT validation in front of Shield while clients use Shield proxy tokens (opaque), or /mcp
# will get 401. The optional AuthPolicy document at the bottom is for Istio Gateway API ingress to the MCP listener when
# clients send a raw OpenShift access token, or when you split listeners; apply it only if you use that topology (see comments there).
#
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: default
  # Note: No ClusterRoleBinding needed!
  # MCP Gateway uses Bearer tokens from the Authorization header (user's OAuth token)
  # for authentication with backend MCP servers, not the ServiceAccount token.
  # The ServiceAccount is only needed for the pod to run.
  # All permissions come from the user's OAuth token that MCP Shield forwards. See MCP Gateway deployment guide for details.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-config
  namespace: default
  labels:
    app: mcp-gateway
data:
  config.yaml: |
    # MCP Gateway configuration
    # This is a minimal example - adjust based on your needs
    # IMPORTANT: You must configure at least one backend MCP server for the gateway to work
    # 
    # Example configurations for common MCP servers:
    #
    # Prometheus MCP Server:
    # servers:
    #   - name: prometheus
    #     url: http://prometheus-mcp-server.default.svc:8080/mcp
    #     toolPrefix: prometheus_
    #     enabled: true
    #     hostname: prometheus.mcp.local
    #
    # Kubernetes MCP Server:
    # servers:
    #   - name: kubernetes
    #     url: http://kubernetes-mcp-server.default.svc:8080/mcp
    #     toolPrefix: k8s_
    #     enabled: true
    #     hostname: kubernetes.mcp.local
    #
    # Loki MCP Server:
    # servers:
    #   - name: loki
    #     url: http://loki-mcp.default.svc:8080/stream
    #     toolPrefix: loki_
    #     enabled: true
    #     hostname: loki.mcp.local
    #
    # IMPORTANT: Do NOT set credentialEnvVar for backend servers when using MCP Shield
    # MCP Shield provides the Authorization header dynamically, so static credentials
    # are not needed and would override the dynamic token from MCP Shield
    #
    # For now, this is an empty configuration - add your backend MCP servers above
    servers: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: default
  labels:
    app: mcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
    spec:
      serviceAccountName: mcp-gateway
      containers:
      # Main mcp-gateway container
      - name: mcp-broker-router
        image: ghcr.io/kagenti/mcp-gateway:latest
        imagePullPolicy: IfNotPresent
        command:
          - ./mcp_gateway
        args:
          - '--mcp-gateway-config=/config/config.yaml'
          - '--mcp-broker-public-address=0.0.0.0:8080'
          - '--mcp-gateway-public-host=mcp-gateway.apps.PLACEHOLDER'
          # Same pod: router must reach broker HTTP without Istio DNS (default private host points at gateway-system).
          - '--mcp-gateway-private-host=127.0.0.1:8080'
          - '--mcp-router-address=0.0.0.0:50051'
          - '--log-level=0'
        env:
          # Required by mcp-gateway (see upstream cmd/mcp-broker-router). Replace with a Secret in production.
          - name: JWT_SESSION_SIGNING_KEY
            value: "e2e-dev-only-replace-with-kubernetes-secret-at-least-32-bytes"
          # Broker OAuth metadata (MCP protected resource) — point MCP clients at the same public host as MCP Shield (Route below).
          - name: OAUTH_RESOURCE_NAME
            value: "MCP Server"
          - name: OAUTH_RESOURCE
            value: "https://mcp-gateway.apps.PLACEHOLDER/mcp"
          - name: OAUTH_AUTHORIZATION_SERVERS
            value: "https://mcp-gateway.apps.PLACEHOLDER"
          - name: OAUTH_BEARER_METHODS_SUPPORTED
            value: "header"
          - name: OAUTH_SCOPES_SUPPORTED
            value: "openid"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50051
          name: grpc
        volumeMounts:
        - name: config-volume
          mountPath: /config
        # Prefer TCP: some gateway images may not expose the same HTTP paths on :8080.
        # NotReady on this container removes the pod from Service endpoints → Route "Application is not available".
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      # MCP Shield sidecar container
      - name: mcp-shield
        image: quay.io/jpinsonn/mcp-shield:dev
        args:
          - '--listen=:8081'
          - '--log-level=info'
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: oauth
        env:
          # OAuth Configuration
          # OAUTH_AUTHORIZATION_SERVERS should point to the public URL where MCP Shield is accessible
          - name: OAUTH_AUTHORIZATION_SERVERS
            value: "https://mcp-gateway.apps.PLACEHOLDER"
          # INSPECTOR_ORIGIN is the origin of the MCP Inspector (for CORS headers)
          - name: INSPECTOR_ORIGIN
            value: "https://mcp-inspector.apps.PLACEHOLDER"
          # OAUTH_CLIENT_ID must match the OAuthClient name in OpenShift
          - name: OAUTH_CLIENT_ID
            value: "mcp-gateway"
          # OAUTH_REDIRECT_URIS (optional) - comma-separated list of additional redirect URIs
          # Default redirect URIs are automatically generated from OAUTH_AUTHORIZATION_SERVERS and INSPECTOR_ORIGIN
          # - name: OAUTH_REDIRECT_URIS
          #   value: "https://custom-redirect.example.com/callback"
          # Token exchange from the pod: use in-cluster OAuth. The public oauth-openshift.apps.* URL
          # often hangs or times out from pods (504 on /oauth/token). Authorize stays on apps (browser).
          - name: OPENSHIFT_OAUTH_TOKEN_URL
            value: "https://oauth-openshift.openshift-authentication.svc.cluster.local/oauth/token"
          # MCP Backend Configuration
          # MCP_BACKEND_URL is the URL of the MCP Gateway container (defaults to http://localhost:8080)
          # In a sidecar setup, this should point to the main container's port
          - name: MCP_BACKEND_URL
            value: "http://localhost:8080"  # Points to mcp-broker-router container in the same pod
          # MCP_BACKEND_PATH is the endpoint path to forward requests to
          # For MCP Gateway, use /mcp (default)
          - name: MCP_BACKEND_PATH
            value: "/mcp"  # MCP Gateway uses /mcp endpoint
          # All MCP JSON-RPC through mcp-gateway (required if you rely on Envoy/Kuadrant in front of the broker only).
          - name: MCP_SHIELD_DIRECT_TOOL_ROUTING
            value: "false"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: mcp-gateway-config
---
kind: Service
apiVersion: v1
metadata:
  name: mcp-gateway
  namespace: default
  labels:
    app: mcp-gateway
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: mcp-gateway-tls
spec:
  selector:
    app: mcp-gateway
  ports:
    # Expose MCP Shield port (clients connect here)
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: oauth
    # Also expose direct MCP Gateway port (optional, for internal use)
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: mcp
    # Expose gRPC router port (internal use, for Envoy ext_proc)
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
---
# Public ingress: terminate TLS at the router and send MCP + OAuth traffic to MCP Shield (:8081), not directly to the broker.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-gateway
  namespace: default
  labels:
    app: mcp-gateway
spec:
  host: mcp-gateway.apps.PLACEHOLDER
  to:
    kind: Service
    name: mcp-gateway
    weight: 100
  port:
    targetPort: oauth
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# OAuth Client configuration (create this using oc command or apply separately)
# Example command to create OAuth client:
# oc create -f - <<EOF
# apiVersion: oauth.openshift.io/v1
# kind: OAuthClient
# metadata:
#   name: mcp-gateway
# grantMethod: auto
# redirectURIs:
#   - "https://mcp-gateway.default.svc:8081/oauth/callback"
#   - "https://mcp-gateway.apps.<YOUR_CLUSTER_DOMAIN>/oauth/callback"
# EOF
---
# Optional: example Kuadrant AuthPolicy for OpenShift access tokens (JWT) at the Istio Gateway.
# Apply the ConfigMap with: kubectl apply -f openshift-mcp-gateway-sidecar.yml
# Extract and edit: kubectl get cm mcp-gateway-kuadrant-authpolicy-example -n default -o jsonpath='{.data.authpolicy\.yaml}' > /tmp/authpolicy.yaml
# Then: kubectl apply -f /tmp/authpolicy.yaml   (after fixing namespace, Gateway name, sectionName, issuerUrl)
#
# Do NOT use this JWT policy on the same listener where MCP Shield clients send proxy tokens (opaque Bearer) — validation will fail.
# Use this only when the Gateway fronts the broker and clients send raw OpenShift OAuth access tokens, or after you redesign auth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-kuadrant-authpolicy-example
  namespace: default
  labels:
    app: mcp-gateway
data:
  README: |
    authpolicy.yaml is an example Kuadrant AuthPolicy (not applied automatically).
    Prerequisites: Kuadrant, Gateway API Gateway named like targetRef below, listener sectionName matching your MCP listener.
    issuerUrl must match your cluster OpenShift OAuth (curl -s https://oauth-openshift.apps.<cluster>/.well-known/oauth-authorization-server | jq .issuer).
    Excludes /.well-known and /oauth* so OAuth discovery and Shield endpoints can stay unauthenticated at the mesh if traffic ever hits the same host.
  authpolicy.yaml: |
    apiVersion: kuadrant.io/v1
    kind: AuthPolicy
    metadata:
      name: mcp-openshift-user-jwt
      namespace: gateway-system
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: mcp-gateway
        sectionName: mcp
      defaults:
        when:
          - predicate: "!request.path.contains('/.well-known')"
          - predicate: "!request.path.contains('/oauth')"
          - predicate: "!request.path.contains('/oauth2')"
      rules:
        authentication:
          openshift-user:
            jwt:
              issuerUrl: https://oauth-openshift.apps.PLACEHOLDER
        response:
          unauthenticated:
            code: 401
            headers:
              WWW-Authenticate:
                value: Bearer resource_metadata=https://mcp-gateway.apps.PLACEHOLDER/.well-known/oauth-protected-resource
            body:
              value: |
                {"error":"Unauthorized","message":"Authentication required."}

