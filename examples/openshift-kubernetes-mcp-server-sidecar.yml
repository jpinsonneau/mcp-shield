# Kubernetes MCP Server + MCP Shield (OpenShift user OAuth / passthrough)
#
# Replace PLACEHOLDER with your cluster apps domain (e.g. ostest.test.metalkube.org).
#
# Traffic: MCP clients -> Route :8081 (MCP Shield) -> OAuth -> localhost:8080 (kubernetes-mcp-server /mcp)
# Cluster API and toolsets use the user's OpenShift token (cluster_auth_mode = passthrough), not the pod SA.
# Do not set require_oauth on the server — Shield terminates OAuth for clients.
#
# Deploy: ./deploy-openshift-kubernetes-mcp-server-sidecar.sh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-server-config
  namespace: default
  labels:
    app: kubernetes-mcp-server
data:
  config.toml: |
    port = "8080"
    toolsets = ["core", "config"]
    cluster_auth_mode = "passthrough"
    # require_oauth stays false (default). MCP Shield forwards Authorization: Bearer <user token>.

    # Uncomment when the container image includes the netobserv toolset (custom build):
    # toolsets = ["core", "config", "netobserv"]
    # [toolset_configs.netobserv]
    # namespace = "netobserv"
    # service = "netobserv-plugin"
    # port = 9001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-server
  namespace: default
  # No ClusterRoleBinding: API access uses the user's OAuth token from MCP Shield.
  # The SA is only required for the pod to run.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: default
  labels:
    app: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      automountServiceAccountToken: true
      containers:
      - name: kubernetes-mcp-server
        image: quay.io/containers/kubernetes_mcp_server:latest
        args:
          - "--config"
          - "/etc/kubernetes-mcp-server/config.toml"
          - "--log-level=2"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/kubernetes-mcp-server
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      - name: mcp-shield
        image: quay.io/jpinsonn/mcp-shield:dev
        args:
          - "--listen=:8081"
          - "--log-level=info"
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: oauth
        env:
          - name: OAUTH_AUTHORIZATION_SERVERS
            value: "https://kubernetes-mcp-server.apps.PLACEHOLDER"
          - name: INSPECTOR_ORIGIN
            value: "http://localhost:6274"
          - name: OAUTH_CLIENT_ID
            value: "kubernetes-mcp-server"
          # In-cluster token exchange (avoids 504 from oauth-openshift.apps.* inside pods).
          - name: OPENSHIFT_OAUTH_TOKEN_URL
            value: "https://oauth-openshift.openshift-authentication.svc.cluster.local/oauth/token"
          - name: MCP_BACKEND_URL
            value: "http://localhost:8080"
          - name: MCP_BACKEND_PATH
            value: "/mcp"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: kubernetes-mcp-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  namespace: default
  labels:
    app: kubernetes-mcp-server
spec:
  selector:
    app: kubernetes-mcp-server
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: oauth
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: mcp
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kubernetes-mcp-server
  namespace: default
  labels:
    app: kubernetes-mcp-server
spec:
  host: kubernetes-mcp-server.apps.PLACEHOLDER
  to:
    kind: Service
    name: kubernetes-mcp-server
    weight: 100
  port:
    targetPort: oauth
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# OAuthClient (cluster-scoped) — create via deploy script or:
# oc create oauthclient kubernetes-mcp-server --grant-method=auto \
#   --redirect-uri="https://kubernetes-mcp-server.default.svc:8081/oauth/callback" \
#   --redirect-uri="https://kubernetes-mcp-server.apps.<domain>/oauth/callback"
